<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create - Sticky Notes</title>
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <!-- start header html  -->
    <header class="header fade-in">
        <p> <span id="username">Loading...</span></p>
        <a href="/" class="logo">
            <h5>Create Sticky Note</h5>
        </a>
        <div>
            <button class="btn logout-btn" id="logoutBtn">
                Logout
            </button>
        </div>
    </header>
    <!-- end header html -->

    <!-- start main content html -->
    <main class="main-content slide-in-up">
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Creating...</p>
        </div>
        <form id="createNote">
            <div style="display: flex; gap: 20px;">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required placeholder="Enter note title">
                    <div class="field-error" id="title-error"></div>
                </div>
                <div class="form-group">
                    <label for="color">Color Status</label>
                    <select id="color" name="color" required>
                        <option value="" disabled selected>Select color</option>
                        <option value="red">Red</option>
                        <option value="green">Green</option>
                        <option value="blue">Blue</option>
                        <option value="yellow">Yellow</option>
                    </select>
                    <div class="field-error" id="color-error"></div>
                </div>
            </div>
            <div class="form-group">
                <label for="content">Details</label>
                <textarea id="content" rows="12" name="content" required placeholder="Enter note details"></textarea>
                <div class="field-error" id="content-error"></div>
            </div>

            <button type="submit" class="btn" id="createBtn">
                Create Note
            </button>

        </form>
    </main>
    <!-- End main content html -->

    <script src="js/index.js"></script>
    <script src="js/common/auth.js"></script>
    <script src="js/partial/create.js"></script>
</body>

</html>
