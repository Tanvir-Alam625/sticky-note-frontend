<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sticky Notes</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/partial/login.css">
</head>

<body>
    <div class="login-container slide-in-up">
        <div class="logo">
            <h1>📝 Sticky Notes</h1>
            <p>Welcome back!</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Signing you in...</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
                <div class="field-error" id="email-error"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
                <div class="field-error" id="password-error"></div>
            </div>

            <div class="login-options">
                <div class="remember-me-container">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="register.html">Create one here</a>
        </div>
    </div>

    <script src="js/index.js"></script>
    <script src="js/partial/login.js"></script>

    <script>
        // Handle forgot password (placeholder for future implementation)
        function handleForgotPassword() {
            Utils.showMessage('Forgot password functionality will be available soon.', 'success');
        }
    </script>
</body>

</html>
